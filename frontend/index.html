<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de control · Sincronizador de reservas</title>
<style>
    :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #243244;
        background: #eef3f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #eef3f7 0%, #f8fafc 55%, #e7f0ee 100%); }
    body > h1, body > #out { width: min(100% - 2rem, 64rem); margin-left: auto; margin-right: auto; }
    h1 { margin-top: 0; padding-top: 3rem; margin-bottom: 1.5rem; color: #183247; font-size: clamp(1.5rem, 3vw, 2.15rem); letter-spacing: .01em; }
    #out { padding: 1.5rem; border: 1px solid #d9e3ea; border-radius: 14px; background: rgba(255, 255, 255, .88); box-shadow: 0 14px 36px rgba(35, 57, 73, .08); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; border: 1px solid #dce5eb; border-radius: 10px; background: #fff; }
    th, td { padding: .9rem 1rem; text-align: left; border-bottom: 1px solid #e8eef2; }
    th { color: #607182; background: #f5f8fa; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    tbody tr { cursor: pointer; transition: background-color .16s ease; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f0f7f5; }
    td:first-child { color: #1b6470; font-weight: 650; }
    td:last-child { color: #755b16; font-weight: 650; }
    dl { display: grid; grid-template-columns: minmax(7rem, auto) 1fr; gap: .75rem 1.5rem; margin: 1.5rem 0; align-items: baseline; }
    dt { color: #657687; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    dd { margin: 0; color: #243244; }
    .note { margin: 0; color: #657687; font-size: .95rem; }
    .problem { margin: 0; color: #a33d3d; }
    .back { display: inline-block; margin-bottom: .75rem; color: #176b75; font-weight: 650; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    button { border: 0; border-radius: 8px; padding: .65rem 1rem; color: #fff; background: #176b75; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 5px 12px rgba(23, 107, 117, .2); }
    button:hover { background: #125762; }
    button:focus-visible, .back:focus-visible, tbody tr:focus-visible { outline: 3px solid #9bc7c5; outline-offset: 3px; }
    .todo { border: 1px dashed #b58; background: #fdf7fb; padding: 1rem 1.25rem; }
    @media (max-width: 600px) {
        body > h1, body > #out { width: min(100% - 1rem, 64rem); }
        h1 { padding-top: 1.5rem; margin-bottom: 1rem; }
        #out { padding: .75rem; overflow-x: auto; }
        th, td { padding: .75rem .65rem; white-space: nowrap; }
        dl { grid-template-columns: 1fr; gap: .25rem; }
        dd { margin-bottom: .6rem; }
    }
</style>
</head>
<body>
<h1>Centro de control · Sincronizador de reservas</h1>

<div id="out">Cargando…</div>

<script>
/**
 * La pantalla. Pesa lo mismo que el back.
 *
 * Escrito ya: el `fetch` con el sobre de error y el enrutado por `?booking=`.
 * Tuyo: las dos funciones que pintan. Puedes tirar este fichero entero y montarlo con lo que
 * quieras (React, Vue, Svelte, Vite...). No se puntúa la tecnología ni el diseño.
 */
const out = document.getElementById("out");

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[character]);
}

async function ask(path, options = {}) {
    const response = await fetch(path, options);
    const body = await response.json().catch(() => null);
    if (!response.ok) {
        throw new Error(`${body?.error?.code ?? response.status}: ${body?.error?.message ?? ""}`);
    }
    return body;
}

/**
 * TU TRABAJO (1 de 2): el listado.
 *
 * Recibe lo que devuelva tu `GET /api/bookings`. De cada reserva tiene que verse su estado
 * (🟢 Sincronizado, 🟡 Reintentando, 🔴 Fallido, o lo que decidas para "aún sin empezar"), y al
 * pulsar una, entrar en su detalle.
 */
function renderList(bookings) {
        out.className = "";
        if (bookings.length === 0) {
                out.innerHTML = '<p class="note">Todavía no hay reservas.</p>';
                return;
        }
        out.innerHTML = `<table><thead><tr><th>Reserva</th><th>Huésped</th><th>Entrada</th><th>Estado</th></tr></thead><tbody>${bookings.map((booking) => `
            <tr onclick="location.href='?booking=${encodeURIComponent(booking.id)}'"><td>${escapeHtml(booking.id)}</td><td>${escapeHtml(booking.guestName)}</td><td>${escapeHtml(booking.checkIn)}</td><td>${escapeHtml(booking.status)}</td></tr>`).join("")}</tbody></table>`;
}

/**
 * TU TRABAJO (2 de 2): el detalle de una reserva.
 *
 * Desde aquí se fuerza la sincronización manual de una reserva fallida: un botón que llama a tu
 * endpoint de reintento y enseña cómo va.
 */
function renderDetail(booking) {
        out.className = "";
        const retry = booking.status === "failed" ? `<button id="retry">Forzar sincronización</button>` : "";
        out.innerHTML = `<p><a class="back" href="?">← todas las reservas</a></p><h2>${escapeHtml(booking.id)}</h2><dl>
            <dt>Canal</dt><dd>${escapeHtml(booking.channel)}</dd><dt>Huésped</dt><dd>${escapeHtml(booking.guestName)}</dd>
            <dt>Estancia</dt><dd>${escapeHtml(booking.checkIn)} a ${escapeHtml(booking.checkOut)}</dd><dt>Precio</dt><dd>${escapeHtml(booking.totalPrice)} ${escapeHtml(booking.currency)}</dd>
            <dt>Estado</dt><dd>${escapeHtml(booking.status)}</dd><dt>Intentos</dt><dd>${escapeHtml(booking.attempts)}</dd>
            <dt>Último error</dt><dd>${escapeHtml(booking.lastError || "-")}</dd><dt>Referencia PMS</dt><dd>${escapeHtml(booking.pmsReference || "-")}</dd></dl>${retry}`;
        document.getElementById("retry")?.addEventListener("click", async () => {
                await ask(`/api/bookings/${encodeURIComponent(booking.id)}/retry`, { method: "POST" });
                await load();
        });
}

/** El enrutado y el manejo del fallo. Escrito, para que empieces por lo que se ve. */
async function load() {
    const wanted = new URLSearchParams(location.search).get("booking");
    out.textContent = "Cargando…";
    try {
        if (wanted) {
            renderDetail(await ask(`/api/bookings/${encodeURIComponent(wanted)}`));
        } else {
            renderList((await ask("/api/bookings")).items ?? []);
        }
    } catch (error) {
        out.innerHTML = `<p class="problem">${escapeHtml(error.message ?? error)}</p>`;
    }
}

load();
</script>
</body>
</html>
